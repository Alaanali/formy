services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: formy
      POSTGRES_USER: formy
      POSTGRES_PASSWORD: formy
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formy"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
